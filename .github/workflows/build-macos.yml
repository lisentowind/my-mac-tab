name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 工程由 Xcode 27 创建（objectVersion 110），并使用 macOS 26 SDK 的 glassEffect。
    runs-on: xcode-27
    timeout-minutes: 20
    # 可选固定签名：Secret MACOS_CERT_P12 / MACOS_CERT_PASSWORD，变量 MACOS_CERT_NAME。
    # 未配置时自动回退 ad-hoc 签名。
    env:
      SIGNING_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SIGNING_CERT_NAME: ${{ vars.MACOS_CERT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Import signing certificate
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_CERT_P12:-}" ]]; then
            echo "未配置 MACOS_CERT_P12，使用 ad-hoc 签名。"
            exit 0
          fi
          if [[ -z "${SIGNING_CERT_NAME:-}" ]]; then
            echo "缺少仓库变量 MACOS_CERT_NAME。" >&2
            exit 1
          fi
          if [[ -z "${SIGNING_CERT_PASSWORD:-}" ]]; then
            echo "缺少 Secret MACOS_CERT_PASSWORD。" >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/signing-cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_READY=1" >> "$GITHUB_ENV"

          printf '%s' "$SIGNING_CERT_P12" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -p codesigning "$KEYCHAIN"
          rm -f "$CERT_PATH"

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project MyMacTab.xcodeproj \
            -scheme MyMacTab \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Sign and package DMG
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/MyMacTab.app"
          test -d "$APP"

          if [[ "${SIGNING_READY:-0}" == "1" ]]; then
            echo "使用固定证书签名：$SIGNING_CERT_NAME"
            codesign --force --options runtime --sign "$SIGNING_CERT_NAME" "$APP"
          else
            echo "使用 ad-hoc 签名。"
            codesign --force --sign - "$APP"
          fi
          codesign --verify --strict --verbose=2 "$APP"

          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/MyMacTab.app"
          ln -s /Applications "$STAGE/Applications"

          DMG="MyMacTab-macOS-arm64.dmg"
          hdiutil create -volname "MyMacTab" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMacTab-macOS-arm64
          path: |
            MyMacTab-macOS-arm64.dmg
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Refusing to publish unexpected tag: $TAG" >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" \
            MyMacTab-macOS-arm64.dmg SHA256SUMS.txt --clobber

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
